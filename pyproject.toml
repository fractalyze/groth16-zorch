[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "groth16-zorch"
version = "0.1.2"
description = "Groth16 prover in Python using FRX (circom/snarkjs compatible)"
readme = "README.md"
license = {text = "Apache-2.0"}
# >=3.11, not >=3.9: frxlib publishes a single cp311 wheel, so 3.9/3.10/3.12
# cannot resolve at all. requires-python is the only Python gate pip enforces, so
# advertising a wider range does not add support — it just moves the failure from
# a clean "Requires-Python" rejection to a resolution error deep inside frx.
requires-python = ">=3.11"
# frx (the field/ring backend groth16_zorch imports directly) pulls the rest of
# the CPU stack transitively (frxlib, zk-dtypes), so `pip install groth16-zorch`
# is importable and CPU-runnable on its own. The `.dev0` floor stays compatible
# with the exact dev build the consuming workspace pins in requirements.in — a
# plain `>=0.10.0` would conflict with it (dev builds sort below the release).
# GPU needs the frx-cuda12-* plugins, which are too large for PyPI; install them
# from the Fractalyze index (see requirements.in). zkbench is benchmark-only
# (see the `bench` extra below).
dependencies = [
    "numpy>=2.3.5",
    "frx>=0.10.0.dev0",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
]

[project.scripts]
groth16-zorch = "groth16_zorch.cli:main"

# zkbench (used only under benchmark/) is served by the Fractalyze index, not
# PyPI. Install with:
#   pip install "groth16-zorch[bench]" --extra-index-url https://fractalyze.github.io/pypi/simple/
[project.optional-dependencies]
bench = ["zkbench>=0.5.0"]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["groth16_zorch*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.mypy]
python_version = "3.11"
files = ["groth16_zorch"]
# Annotations are not required yet; turning these on is a typing pass of its own.
disallow_untyped_defs = false
disallow_incomplete_defs = false
warn_unused_ignores = true
warn_redundant_casts = true

# Untyped or statically unresolvable third parties.
[[tool.mypy.overrides]]
module = ["frx.*", "frxlib.*", "zk_dtypes.*", "zkbench.*", "absl.*", "zorch.*"]
ignore_missing_imports = true
